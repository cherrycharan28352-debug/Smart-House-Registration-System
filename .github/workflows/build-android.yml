name: Build Android APK and Play Store Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Production Assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android APK (Direct Installable APK)
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Build Android App Bundle (Google Play Store AAB)
        working-directory: frontend/android
        run: ./gradlew bundleRelease

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mane-Manege-Police-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Google Play Store Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mane-Manege-Police-PlayStore-AAB
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
